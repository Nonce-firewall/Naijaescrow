[build]
  command   = "npm install && npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  targetPort = 5000

# Static files — serve directly, exclude from SPA fallback
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# SPA fallback — all other routes serve index.html so React Router handles them
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
# ── Security headers ────────────────────────────────────────────────────────
# Applied to every response served by Netlify (pages, assets, API functions).
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent the site from being embedded in iframes on other origins (clickjacking)
    X-Frame-Options = "DENY"
    # Stop browsers from MIME-sniffing the content type
    X-Content-Type-Options = "nosniff"
    # Legacy XSS filter — browsers that still honour it will block reflected XSS
    X-XSS-Protection = "1; mode=block"
    # Only send the origin (no path) as the Referer header on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable browser features that are not needed by this app
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
    # Content Security Policy — prevents XSS by restricting sources of scripts, styles, etc.
    # - script-src: allow inline scripts (vite builds), but require scripts from our origin and trusted CDNs
    # - style-src: allow inline styles (Tailwind JIT), styles from our origin
    # - img-src: allow images from anywhere (user uploads on external hosts, Supabase storage)
    # - connect-src: allow fetch/XHR to Supabase API and CoinGecko for live rates
    # - font-src: allow fonts from our origin
    # - default-src: fallback to 'self' for unlisted directives
    # - object-src: block plugins (Flash, Java)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://klatbnznamwmshqfrzep.supabase.co https://api.coingecko.com wss://klatbnznamwmshqfrzep.supabase.co; font-src 'self'; object-src 'none';"
    
