[build]
  command   = "npm install && npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  targetPort = 5000

# SPA fallback — all routes serve index.html so React Router handles them
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
# ── Security headers ────────────────────────────────────────────────────────
# Applied to every response served by Netlify (pages, assets, API functions).
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent the site from being embedded in iframes on other origins (clickjacking)
    X-Frame-Options = "DENY"
    # Stop browsers from MIME-sniffing the content type
    X-Content-Type-Options = "nosniff"
    # Legacy XSS filter — browsers that still honour it will block reflected XSS
    X-XSS-Protection = "1; mode=block"
    # Only send the origin (no path) as the Referer header on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable browser features that are not needed by this app
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
    
