version: '3.8'

services:
  # PostgreSQL database (Supabase-compatible)
  postgres:
    image: postgres:16-alpine
    container_name: naijaescrow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naijaescrow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naijaescrow-network

  # Redis for caching and sessions (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: naijaescrow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naijaescrow-network

  # Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naijaescrow-app
    environment:
      # Supabase/Database Config
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYyMzg3MzIwMCwiZXhwIjoxOTIzODczMjAwfQ.CRXP3ySUZODgdtQoGg3OR5qZIukLlfjRuBMxrbWgMak}
      
      # Firebase Config
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-demo-key}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-demo.firebaseapp.com}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-demo-project}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-demo.appspot.com}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-123456}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:123456:web:abc123}
      
      # App Config
      NODE_ENV: development
      DISABLE_HMR: "false"
      
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-naijaescrow}
      
      # Redis
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - naijaescrow-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  naijaescrow-network:
    driver: bridge
